name: detection-quality

# Runs cognium-dev against every corpus and scores it against
# baseline/detection-quality.json. A corpus below baseline files a defect.
#
# Nightly, plus on demand. Every run is scored against
# baseline/detection-quality.json; a corpus scoring below it files a defect.
#
# The zero-tolerance TPR policy is measured, not assumed: two runs on different
# hosts against cognium-dev 4.9.20 and 4.9.21 produced byte-identical
# scorecards, so these corpora carry no run-to-run noise and any recall loss is
# a real engine change.

# Split into build -> per-corpus matrix -> report so each corpus is its own
# check. One job for everything meant a corpus that hangs (cognium-dev#421)
# burned the whole run's clock, and a crash in one was indistinguishable from
# a bad run at a glance.

on:
  schedule:
    # 03:00 UTC daily. The sweep itself is ~1s; the cognium-dev build is the
    # cost, so nightly is ample to catch a regression within a day of landing.
    - cron: '0 3 * * *'

  # The sweep exercises itself whenever its own code changes, so a broken
  # harness is caught on the PR that breaks it rather than at the next manual
  # run. Scoped to these two paths — it is not a gate on ordinary changes.
  pull_request:
    paths:
      - 'scripts/run-corpus.mjs'
      - '.github/workflows/detection-quality.yml'
      - 'datasets/**/expectedresults.csv'
      # A baseline change is exactly when a verification run matters most —
      # it is the only way to see what the new reference actually scores.
      - 'baseline/**'

  workflow_dispatch:
    inputs:
      cognium_dev_ref:
        description: 'cognium-dev ref to build and measure (branch, tag or SHA)'
        required: false
        default: main
      publish:
        description: 'Commit the report under results/ instead of only uploading it as an artifact'
        type: boolean
        required: false
        default: false

concurrency:
  group: detection-quality-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  build:
    name: build cognium-dev
    runs-on: [self-hosted, grace]
    container:
      image: node:22-bookworm
    timeout-minutes: 20
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      short: ${{ steps.meta.outputs.short }}
      version: ${{ steps.meta.outputs.version }}
      corpora: ${{ steps.matrix.outputs.corpora }}

    steps:
      - uses: actions/checkout@v4

      # Read-only consumption of the engine repo: this builds cognium-dev to
      # measure it and never writes to it.
      - uses: actions/checkout@v4
        with:
          repository: cogniumhq/cognium-dev
          ref: ${{ inputs.cognium_dev_ref || 'main' }}
          path: .cognium-dev

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # packages/cli builds through `bun build` (scripts/build.mjs), so bun is
      # required even though nothing here runs `bun test`.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - name: Build
        working-directory: .cognium-dev
        run: |
          npm ci
          # `build:all`, not `build`: plain `build` is tsc only and leaves
          # circle-ir/dist/wasm empty, so every scan aborts on a missing
          # web-tree-sitter.wasm. The browser step copies the grammars.
          npm run build:all

      - name: Record what was measured
        id: meta
        run: |
          cd .cognium-dev
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(node packages/cli/dist/cli.js --version | head -1 | grep -oE '[0-9]+[.][0-9]+[.][0-9]+')" >> "$GITHUB_OUTPUT"

      # The matrix comes from the harness manifest, not a list copied into this
      # file. A copy drifts the moment a corpus is added, and that drift looks
      # like a corpus quietly no longer being measured.
      - name: Derive corpus matrix
        id: matrix
        run: echo "corpora=$(node scripts/run-corpus.mjs --cli .cognium-dev/packages/cli/dist/cli.js --list)" >> "$GITHUB_OUTPUT"

      # Shared with every matrix job rather than rebuilt once per corpus.
      - name: Upload built engine
        uses: actions/upload-artifact@v4
        with:
          name: cognium-dev-dist
          path: |
            .cognium-dev/packages/*/dist/
            .cognium-dev/node_modules/
          retention-days: 1
          include-hidden-files: true

  scan:
    name: ${{ matrix.corpus }}
    needs: build
    runs-on: [self-hosted, grace]
    container:
      image: node:22-bookworm
    # Bounded on purpose: cognium-dev#421 hangs indefinitely on two corpora, and
    # an unbounded job would hold a runner until the workflow timeout instead of
    # reporting one red check.
    timeout-minutes: 25
    strategy:
      # A corpus that crashes or hangs must not stop the others reporting —
      # the entire reason for splitting.
      fail-fast: false
      max-parallel: 4
      matrix:
        corpus: ${{ fromJSON(needs.build.outputs.corpora) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/download-artifact@v4
        with:
          name: cognium-dev-dist
          path: .cognium-dev

      - name: Scan and score
        env:
          # Cached across jobs on the persistent runner, so a pinned clone is
          # fetched once rather than once per corpus per night.
          CORPUS_CACHE: /tmp/sast-benchmarks-corpora
        run: |
          node scripts/run-corpus.mjs \
            --cli "$GITHUB_WORKSPACE/.cognium-dev/packages/cli/dist/cli.js" \
            --corpus "${{ matrix.corpus }}" \
            --out "results/run/${{ matrix.corpus }}"

      - name: Upload scorecard
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: scorecard-${{ matrix.corpus }}
          path: results/run/${{ matrix.corpus }}/
          retention-days: 90
          if-no-files-found: error

  report:
    name: report
    needs: [build, scan]
    # always(): a corpus that crashed or hung must still reach the comparison,
    # because an errored corpus IS a regression. Skipping the report on a failed
    # matrix would turn the loudest failures into silence.
    if: ${{ always() }}
    runs-on: [self-hosted, grace]
    container:
      image: node:22-bookworm
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/download-artifact@v4
        with:
          pattern: scorecard-*
          path: /tmp/scorecards

      # merge-scorecards records a baseline corpus with no scorecard as an
      # error, so a job killed before writing its artifact reads as a failure
      # rather than quietly shrinking the run.
      - name: Merge scorecards
        run: |
          node scripts/merge-scorecards.mjs \
            --in /tmp/scorecards \
            --version "${{ needs.build.outputs.version }}" \
            --out "results/$(date -u +%Y-%m-%d)-detection-quality"

      # The verdict. run-corpus.mjs always exits 0 so a measurement can never be
      # mistaken for a pass; this step alone decides regression or not.
      - name: Compare against baseline
        id: compare
        if: ${{ !cancelled() }}
        run: |
          f=$(ls results/*-detection-quality/run-summary.json | head -1)
          echo "summary_file=$f" >> "$GITHUB_OUTPUT"
          if node scripts/compare-baseline.mjs --run "$f" --markdown /tmp/report.md; then
            echo "regressed=false" >> "$GITHUB_OUTPUT"
          else
            echo "regressed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          cat /tmp/report.md >> "$GITHUB_STEP_SUMMARY"
          f=${{ steps.compare.outputs.summary_file }}
          node -e "
            const s = require('$PWD/' + process.argv[1]);
            const m = s.summary;
            const line = (a, b) => console.log('| ' + a + ' | ' + b + ' |');
            console.log('## Detection quality — cognium-dev ' + s.tool.version);
            console.log('');
            console.log('| | |'); console.log('|---|---|');
            line('Cases', m.total_cases);
            line('TP / FN', m.true_positives + ' / ' + m.false_negatives);
            line('FP / TN', m.false_positives + ' / ' + m.true_negatives_known);
            line('Overall TPR', m.overall_tpr);
            line('Overall FPR', m.overall_fpr);
            line('Elapsed', (m.total_elapsed_ms / 1000).toFixed(1) + 's');
            console.log('');
            console.log('| Corpus | Cases | TP | FN | FP | TN | TPR | FPR |');
            console.log('|---|---|---|---|---|---|---|---|');
            for (const r of s.results) {
              if (r.error) { console.log('| ' + r.corpus + ' | — | | | | | ERROR | |'); continue; }
              console.log('| ' + [r.corpus, r.tests, r.tp, r.fn, r.fp, r.tn, r.tpr, r.fpr].join(' | ') + ' |');
            }
          " "$f" > /dev/null
          cat /tmp/report.md

      # One issue per ongoing regression, not one per run: a nightly that opens
      # a fresh issue every night is muted within a week. The marker below is
      # searched for; an existing open issue is commented on instead.
      #
      # github-script rather than the gh CLI: this job runs in a container that
      # has no gh binary, and a JS action runs on the node the runner mounts in.
      - name: File, update or resolve the defect
        if: ${{ !cancelled() && steps.compare.outputs.regressed != '' }}
        uses: actions/github-script@v7
        with:
          # Defects belong where the fix lands. Without a cross-repo token the
          # built-in one can only write here, so the finding still surfaces
          # rather than being silently dropped.
          github-token: ${{ secrets.COGNIUM_DEV_ISSUES_TOKEN || github.token }}
          script: |
            const fs = require('fs');
            const MARKER = '<!-- detection-quality-regression -->';
            const regressed = '${{ steps.compare.outputs.regressed }}' === 'true';
            const report = fs.readFileSync('/tmp/report.md', 'utf8');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha = '${{ needs.build.outputs.sha }}';

            const crossRepo = Boolean('${{ secrets.COGNIUM_DEV_ISSUES_TOKEN }}');
            const target = crossRepo
              ? { owner: 'cogniumhq', repo: 'cognium-dev' }
              : { owner: context.repo.owner, repo: context.repo.repo };

            // Search rather than list-and-filter: the tracker may be large, and
            // an issue past the first page would look like "none open" and get
            // duplicated every night.
            const q = `repo:${target.owner}/${target.repo} is:issue is:open in:body "${MARKER}"`;
            const found = await github.rest.search.issuesAndPullRequests({ q, per_page: 1 });
            const existing = found.data.items[0];

            if (regressed) {
              const body = [
                MARKER, '',
                report, '',
                `Run: ${runUrl}`,
                `Measured: cognium-dev \`${sha}\``,
                'Baseline: `baseline/detection-quality.json`',
                '',
                'Scored by `scripts/run-corpus.mjs`, compared by `scripts/compare-baseline.mjs`.',
                'Named cases come from the per-corpus scorecards in the run artifact.',
              ].join('\n');

              if (existing) {
                await github.rest.issues.createComment({ ...target, issue_number: existing.number, body });
                core.notice(`updated defect #${existing.number} on ${target.owner}/${target.repo}`);
              } else {
                const created = await github.rest.issues.create({
                  ...target,
                  title: 'Detection-quality regression against baseline',
                  body,
                });
                core.notice(`filed defect #${created.data.number} on ${target.owner}/${target.repo}`);
              }
              if (!crossRepo) {
                core.warning('COGNIUM_DEV_ISSUES_TOKEN is not set — the defect was filed in this repository rather than cognium-dev.');
              }
              return;
            }

            // Green. Note recovery on an open defect, but leave closing to a
            // human: a recovery can also mean the baseline should move.
            if (!existing) { core.info('no regression, no open defect'); return; }
            await github.rest.issues.createComment({
              ...target,
              issue_number: existing.number,
              body: [
                MARKER, '',
                `Back at or above baseline as of cognium-dev \`${sha}\`.`, '',
                report, '',
                `Run: ${runUrl}`, '',
                'Closing is a human call — the baseline may warrant updating if this reflects intended new behaviour.',
              ].join('\n'),
            });
            core.notice(`noted recovery on #${existing.number}`);

      # Fail the run last, so the report, the artifact and the defect all land
      # first. A red nightly with no artifact is not diagnosable.
      - name: Fail on regression
        if: ${{ steps.compare.outputs.regressed == 'true' }}
        run: |
          echo "detection quality regressed against baseline/detection-quality.json"
          exit 1
