name: detection-quality

# Runs cognium-dev against every corpus and scores it against
# baseline/detection-quality.json. A corpus below baseline files a defect.
# A labelled case the scan does not detect is also logged as a defect, except
# cases already named in the baseline missed list. That log does not fail the
# gate: an ungated corpus stays recorded, and its misses are filed.
#
# Coverage grows with the same daily run. A labelled case this run detects is
# added to baseline/coverage.json, and a later run that misses it fails. The
# file only grows, so today's detections are still required tomorrow.
#
# Nightly, monthly, plus on demand. Every run is scored against
# baseline/detection-quality.json; a corpus scoring below it files a defect.
# The monthly run, and a dispatch with publish=true, also commits the dated
# result set (results/<date>/, raw/<date>/ and the results index). The nightly
# run commits only its sweep, results/<date>-detection-quality/: that folder is
# what cogniumhq/loops checks/measurements.py reads, and without a nightly
# commit a fix merged into cognium-dev went unmeasured until someone dispatched
# a publish (none ran 2026-11-08 to 11-09).
#
# The zero-tolerance TPR policy is measured, not assumed: two runs on different
# hosts against cognium-dev 4.9.20 and 4.9.21 produced byte-identical
# scorecards, so these corpora carry no run-to-run noise and any recall loss is
# a real engine change.

# Split into build -> per-corpus matrix -> report so each corpus is its own
# check. One job for everything meant a corpus that hangs (cognium-dev#421)
# burned the whole run's clock, and a crash in one was indistinguishable from
# a bad run at a glance.

on:
  schedule:
    # 03:00 UTC daily. The sweep itself is ~1s; the cognium-dev build is the
    # cost, so nightly is ample to catch a regression within a day of landing.
    # Commits the sweep folder only; the dated result set stays monthly.
    - cron: '0 3 * * *'
    # 04:00 UTC on the 1st. Same sweep, then commit results/<date>/ so the
    # benchmark page has a measurement for the month. An hour after the
    # nightly so the two runs do not share a clock.
    - cron: '0 4 1 * *'

  # The sweep exercises itself whenever its own code changes, so a broken
  # harness is caught on the PR that breaks it rather than at the next manual
  # run. Scoped to these two paths — it is not a gate on ordinary changes.
  pull_request:
    paths:
      - 'scripts/run-corpus.mjs'
      - 'scripts/merge-scorecards.mjs'
      - 'scripts/publish-run.mjs'
      - '.github/workflows/detection-quality.yml'
      - 'datasets/**/expectedresults.csv'
      # A baseline change is exactly when a verification run matters most —
      # it is the only way to see what the new reference actually scores.
      - 'baseline/**'

  workflow_dispatch:
    inputs:
      cognium_dev_ref:
        description: 'cognium-dev ref to build and measure (branch, tag or SHA)'
        required: false
        default: main
      publish:
        description: 'Commit the dated result set under results/ and raw/. The monthly schedule does this without the input.'
        type: boolean
        required: false
        default: false

concurrency:
  group: detection-quality-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

# Fork PRs never reach the self-hosted `grace` runner: this repo is public, and
# a fork PR's code would otherwise run on a persistent box we own. They run the
# same jobs on ubuntu-latest instead (skipping them would let required checks
# pass without running).

jobs:
  build:
    name: build cognium-dev
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted", "grace"]') }}
    container:
      image: node:22-bookworm
    timeout-minutes: 20
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      short: ${{ steps.meta.outputs.short }}
      version: ${{ steps.meta.outputs.version }}
      ref: ${{ steps.meta.outputs.ref }}
      corpora: ${{ steps.matrix.outputs.corpora }}

    steps:
      - uses: actions/checkout@v4

      # Read-only consumption of the engine repo: this builds cognium-dev to
      # measure it and never writes to it.
      - uses: actions/checkout@v4
        with:
          repository: cogniumhq/cognium-dev
          ref: ${{ inputs.cognium_dev_ref || 'main' }}
          path: .cognium-dev

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # packages/cli builds through `bun build` (scripts/build.mjs), so bun is
      # required even though nothing here runs `bun test`.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - name: Build
        working-directory: .cognium-dev
        run: |
          npm ci
          # `build:all`, not `build`: plain `build` is tsc only and leaves
          # circle-ir/dist/wasm empty, so every scan aborts on a missing
          # web-tree-sitter.wasm. The browser step copies the grammars.
          npm run build:all

      - name: Record what was measured
        id: meta
        run: |
          cd .cognium-dev
          sha=$(git rev-parse HEAD)
          short=$(git rev-parse --short HEAD)
          # A dispatch can pin an old tag (2026-11-03 ran cognium-dev-v4.17.0).
          # The version string is then honestly 4.17.0; the ref and SHA are what
          # stop that from being read as a stale label on a main build.
          ref="${{ inputs.cognium_dev_ref }}"
          if [ -z "$ref" ]; then ref=main; fi
          # Only the `cognium-dev vX.Y.Z` line. The first semver in the output
          # is not the version: a warning above it would be recorded instead.
          ver=$(node packages/cli/dist/cli.js --version | awk '/^cognium-dev v[0-9]+\.[0-9]+\.[0-9]+$/ { print substr($2, 2); exit }')
          pkg=$(node -p "require('./packages/cli/package.json').version")
          if [ -z "$ver" ]; then
            echo "::error::cognium-dev --version did not print a 'cognium-dev vX.Y.Z' line"
            node packages/cli/dist/cli.js --version || true
            exit 1
          fi
          if [ "$ver" != "$pkg" ]; then
            echo "::error::CLI reports v$ver but packages/cli/package.json is $pkg"
            exit 1
          fi
          {
            echo "sha=$sha"
            echo "short=$short"
            echo "version=$ver"
            echo "ref=$ref"
          } >> "$GITHUB_OUTPUT"

      # The matrix comes from the harness manifest, not a list copied into this
      # file. A copy drifts the moment a corpus is added, and that drift looks
      # like a corpus quietly no longer being measured.
      - name: Derive corpus matrix
        id: matrix
        run: echo "corpora=$(node scripts/run-corpus.mjs --cli .cognium-dev/packages/cli/dist/cli.js --list)" >> "$GITHUB_OUTPUT"

      # Shared with every matrix job rather than rebuilt once per corpus.
      - name: Upload built engine
        uses: actions/upload-artifact@v4
        with:
          name: cognium-dev-dist
          path: |
            .cognium-dev/packages/*/dist/
            .cognium-dev/node_modules/
          retention-days: 1
          include-hidden-files: true

  scan:
    name: ${{ matrix.corpus }}
    needs: build
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted", "grace"]') }}
    container:
      image: node:22-bookworm
    # Bounded on purpose: cognium-dev#421 hangs indefinitely on two corpora, and
    # an unbounded job would hold a runner until the workflow timeout instead of
    # reporting one red check.
    timeout-minutes: 25
    strategy:
      # A corpus that crashes or hangs must not stop the others reporting —
      # the entire reason for splitting.
      fail-fast: false
      max-parallel: 4
      matrix:
        corpus: ${{ fromJSON(needs.build.outputs.corpora) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/download-artifact@v4
        with:
          name: cognium-dev-dist
          path: .cognium-dev

      - name: Scan and score
        env:
          # Cached across jobs on the persistent runner, so a pinned clone is
          # fetched once rather than once per corpus per night.
          CORPUS_CACHE: /tmp/sast-benchmarks-corpora
        run: |
          node scripts/run-corpus.mjs \
            --cli "$GITHUB_WORKSPACE/.cognium-dev/packages/cli/dist/cli.js" \
            --corpus "${{ matrix.corpus }}" \
            --out "results/run/${{ matrix.corpus }}"

      - name: Upload scorecard
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: scorecard-${{ matrix.corpus }}
          path: results/run/${{ matrix.corpus }}/
          retention-days: 90
          if-no-files-found: error

  report:
    name: report
    needs: [build, scan]
    # always(): a corpus that crashed or hung must still reach the comparison,
    # because an errored corpus IS a regression. Skipping the report on a failed
    # matrix would turn the loudest failures into silence.
    if: ${{ always() }}
    # contents: write is only for the nightly and monthly commits. Fork pull requests still
    # receive a read-only token, and the publish step does not run on a pull request.
    permissions:
      contents: write
      issues: write
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted", "grace"]') }}
    container:
      image: node:22-bookworm
    timeout-minutes: 15
    env:
      # The 1st-of-month cron commits the dated result set. A dispatch commits
      # it only when its publish input is set. Pull requests never commit.
      PUBLISH_RESULTS: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 4 1 * *') || (github.event_name == 'workflow_dispatch' && inputs.publish == true) }}
      # The daily cron commits the sweep folder alone, for measurements.py.
      PUBLISH_SWEEP: ${{ github.event_name == 'schedule' && github.event.schedule == '0 3 * * *' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run date
        id: date
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          pattern: scorecard-*
          path: /tmp/scorecards

      # merge-scorecards records a baseline corpus with no scorecard as an
      # error, so a job killed before writing its artifact reads as a failure
      # rather than quietly shrinking the run.
      - name: Merge scorecards
        run: |
          node scripts/merge-scorecards.mjs \
            --in /tmp/scorecards \
            --version "${{ needs.build.outputs.version }}" \
            --sha "${{ needs.build.outputs.sha }}" \
            --ref "${{ needs.build.outputs.ref }}" \
            --out "results/${{ steps.date.outputs.day }}-detection-quality"

      # The verdict. run-corpus.mjs always exits 0 so a measurement can never be
      # mistaken for a pass. A drop against the frozen baseline, or a miss of a
      # case baseline/coverage.json already recorded, sets regressed.
      - name: Compare against baseline
        id: compare
        if: ${{ !cancelled() }}
        run: |
          f="results/${{ steps.date.outputs.day }}-detection-quality/run-summary.json"
          echo "summary_file=$f" >> "$GITHUB_OUTPUT"
          if node scripts/compare-baseline.mjs --run "$f" --markdown /tmp/report.md --defects /tmp/defects.md; then
            echo "regressed=false" >> "$GITHUB_OUTPUT"
          else
            echo "regressed=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -f /tmp/defects.md.count ]; then
            echo "undetected=$(cat /tmp/defects.md.count)" >> "$GITHUB_OUTPUT"
          else
            echo "undetected=0" >> "$GITHUB_OUTPUT"
          fi
          # Union today's detections into baseline/coverage.json. A case that
          # was covered and is now missed fails the run; the case stays in the
          # file. New detections are recorded either way, and the publish step
          # commits the grown file.
          if node scripts/update-coverage.mjs --run "$f" --write --lost /tmp/coverage-lost.md; then
            echo "coverage_lost=false" >> "$GITHUB_OUTPUT"
          else
            echo "coverage_lost=true" >> "$GITHUB_OUTPUT"
            echo "regressed=true" >> "$GITHUB_OUTPUT"
            {
              echo ""
              echo "### Coverage lost"
              echo ""
              cat /tmp/coverage-lost.md
            } >> /tmp/report.md
          fi

      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          cat /tmp/report.md >> "$GITHUB_STEP_SUMMARY"
          f=${{ steps.compare.outputs.summary_file }}
          node -e "
            const s = require('$PWD/' + process.argv[1]);
            const m = s.summary;
            const line = (a, b) => console.log('| ' + a + ' | ' + b + ' |');
            console.log('## Detection quality — cognium-dev ' + s.tool.version + (s.tool.ref ? ' (' + s.tool.ref + (s.tool.sha ? ' @ ' + s.tool.sha.slice(0, 7) : '') + ')' : ''));
            console.log('');
            console.log('| | |'); console.log('|---|---|');
            line('Cases', m.total_cases);
            line('TP / FN', m.true_positives + ' / ' + m.false_negatives);
            line('FP / TN', m.false_positives + ' / ' + m.true_negatives_known);
            line('Overall TPR', m.overall_tpr);
            line('Overall FPR', m.overall_fpr);
            if (m.excluded_from_overall) line('Not in overall', m.excluded_from_overall.corpora.join(', ') + ': ' + m.excluded_from_overall.total_cases + ' cases, TPR ' + m.excluded_from_overall.tpr);
            line('Elapsed', (m.total_elapsed_ms / 1000).toFixed(1) + 's');
            console.log('');
            console.log('| Corpus | Cases | TP | FN | FP | TN | TPR | FPR |');
            console.log('|---|---|---|---|---|---|---|---|');
            for (const r of s.results) {
              if (r.error) { console.log('| ' + r.corpus + ' | — | | | | | ERROR | |'); continue; }
              console.log('| ' + [r.corpus, r.tests, r.tp, r.fn, r.fp, r.tn, r.tpr, r.fpr].join(' | ') + ' |');
            }
          " "$f" > /dev/null
          cat /tmp/report.md

      # One issue per ongoing regression, not one per run: a nightly that opens
      # a fresh issue every night is muted within a week. The marker below is
      # searched for; an existing open issue is commented on instead.
      #
      # github-script rather than the gh CLI: this job runs in a container that
      # has no gh binary, and a JS action runs on the node the runner mounts in.
      - name: File, update or resolve the defect
        if: ${{ !cancelled() && steps.compare.outputs.regressed != '' }}
        uses: actions/github-script@v7
        with:
          # Defects belong where the fix lands. Without a cross-repo token the
          # built-in one can only write here, so the finding still surfaces
          # rather than being silently dropped.
          github-token: ${{ secrets.COGNIUM_DEV_ISSUES_TOKEN || github.token }}
          script: |
            const fs = require('fs');
            const MARKER = '<!-- detection-quality-regression -->';
            const regressed = '${{ steps.compare.outputs.regressed }}' === 'true';
            const report = fs.readFileSync('/tmp/report.md', 'utf8');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha = '${{ needs.build.outputs.sha }}';

            const crossRepo = Boolean('${{ secrets.COGNIUM_DEV_ISSUES_TOKEN }}');
            const target = crossRepo
              ? { owner: 'cogniumhq', repo: 'cognium-dev' }
              : { owner: context.repo.owner, repo: context.repo.repo };

            // Search rather than list-and-filter: the tracker may be large, and
            // an issue past the first page would look like "none open" and get
            // duplicated every night.
            const q = `repo:${target.owner}/${target.repo} is:issue is:open in:body "${MARKER}"`;
            const found = await github.rest.search.issuesAndPullRequests({ q, per_page: 1 });
            const existing = found.data.items[0];

            if (regressed) {
              const body = [
                MARKER, '',
                report, '',
                `Run: ${runUrl}`,
                `Measured: cognium-dev \`${sha}\``,
                'Baseline: `baseline/detection-quality.json`',
                '',
                'Scored by `scripts/run-corpus.mjs`, compared by `scripts/compare-baseline.mjs`.',
                'Named cases come from the per-corpus scorecards in the run artifact.',
              ].join('\n');

              if (existing) {
                await github.rest.issues.createComment({ ...target, issue_number: existing.number, body });
                core.notice(`updated defect #${existing.number} on ${target.owner}/${target.repo}`);
              } else {
                const created = await github.rest.issues.create({
                  ...target,
                  title: 'Detection-quality regression against baseline',
                  body,
                });
                core.notice(`filed defect #${created.data.number} on ${target.owner}/${target.repo}`);
              }
              if (!crossRepo) {
                core.warning('COGNIUM_DEV_ISSUES_TOKEN is not set — the defect was filed in this repository rather than cognium-dev.');
              }
              return;
            }

            // Green. Note recovery on an open defect, but leave closing to a
            // human: a recovery can also mean the baseline should move.
            if (!existing) { core.info('no regression, no open defect'); return; }
            await github.rest.issues.createComment({
              ...target,
              issue_number: existing.number,
              body: [
                MARKER, '',
                `Back at or above baseline as of cognium-dev \`${sha}\`.`, '',
                report, '',
                `Run: ${runUrl}`, '',
                'Closing is a human call — the baseline may warrant updating if this reflects intended new behaviour.',
              ].join('\n'),
            });
            core.notice(`noted recovery on #${existing.number}`);

      # Standing misses, separate from a regression. One issue, updated in
      # place: a nightly that opens a fresh issue per miss is muted within a
      # week, and Juliet alone is hundreds of cases. The count is cases the
      # scan did not detect that are not already in the baseline missed list.
      - name: Log undetected cases as defects
        if: ${{ !cancelled() && steps.compare.outputs.undetected != '0' && steps.compare.outputs.undetected != '' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.COGNIUM_DEV_ISSUES_TOKEN || github.token }}
          script: |
            const fs = require('fs');
            const MARKER = '<!-- detection-quality-undetected -->';
            const report = fs.readFileSync('/tmp/defects.md', 'utf8');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha = '${{ needs.build.outputs.sha }}';
            const count = '${{ steps.compare.outputs.undetected }}';

            const crossRepo = Boolean('${{ secrets.COGNIUM_DEV_ISSUES_TOKEN }}');
            const target = crossRepo
              ? { owner: 'cogniumhq', repo: 'cognium-dev' }
              : { owner: context.repo.owner, repo: context.repo.repo };

            const q = `repo:${target.owner}/${target.repo} is:issue is:open in:body "${MARKER}"`;
            const found = await github.rest.search.issuesAndPullRequests({ q, per_page: 1 });
            const existing = found.data.items[0];

            const body = [
              MARKER, '',
              report, '',
              `Run: ${runUrl}`,
              `Measured: cognium-dev \`${sha}\``,
              '',
              'Logged by `scripts/compare-baseline.mjs --defects`.',
              'A case already in `baseline/detection-quality.json` `missed_cases` is not repeated.',
              'The full list for a truncated corpus is that corpus\'s scorecard in the run artifact.',
            ].join('\n');

            if (existing) {
              await github.rest.issues.createComment({ ...target, issue_number: existing.number, body });
              core.notice(`updated undetected-case defect #${existing.number} (${count} cases) on ${target.owner}/${target.repo}`);
            } else {
              const created = await github.rest.issues.create({
                ...target,
                title: `Detection-quality: ${count} labelled cases not detected`,
                body,
              });
              core.notice(`filed undetected-case defect #${created.data.number} (${count} cases) on ${target.owner}/${target.repo}`);
            }
            if (!crossRepo) {
              core.warning('COGNIUM_DEV_ISSUES_TOKEN is not set — the defect was filed in this repository rather than cognium-dev.');
            }

      # Monthly, and an on-demand publish. Writes results/<date>/ from the
      # merged scorecards and pushes it to main. A corpus that did not score
      # still commits its scorecards (exit 2) and does not write results.json.
      # Nightly always updates results/<date>-detection-quality/. That folder
      # is what measurements.py reads. Skipping it when a dated page already
      # existed froze the 2026-11-03 sweep on a dispatch of tag
      # cognium-dev-v4.17.0 after the scheduled main run had measured 4.19.0.
      # This step is before the regression failure so a red month is still
      # recorded. Pull requests do not reach it.
      - name: Publish the dated result set
        if: ${{ (env.PUBLISH_RESULTS == 'true' || env.PUBLISH_SWEEP == 'true') && !cancelled() }}
        # The container's default shell is `sh -e` (dash), which has no pipefail:
        # without this the step dies on its first line and nothing is published
        # (2026-11-01 run, job 124835372264: "set: Illegal option -o pipefail").
        shell: bash
        run: |
          set -euo pipefail
          DAY="${{ steps.date.outputs.day }}"
          if ! command -v git >/dev/null 2>&1; then
            apt-get update -qq && apt-get install -y -qq git
          fi
          # The job runs as root in the container, but the checkout belongs to the
          # runner's user, so git refuses it ("dubious ownership"); actions/checkout
          # only trusts it while it runs (2026-11-02 run 41539264850, exit 128).
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          SWEEP="results/${DAY}-detection-quality"
          if [ "$PUBLISH_RESULTS" = "true" ]; then
            code=0
            node scripts/publish-run.mjs \
              --run "${SWEEP}/run-summary.json" \
              --date "$DAY" \
              --sha "${{ needs.build.outputs.sha }}" \
              --scans /tmp/scorecards \
              --index || code=$?
            if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
              exit "$code"
            fi
            if [ "$code" -eq 0 ]; then
              node scripts/validate-results.mjs
            fi
          else
            # publish-run.mjs writes the sweep README; a nightly sweep gets its own.
            printf '%s\n' \
              "# Detection-quality sweep — ${DAY} (nightly)" \
              "" \
              "Nightly sweep. cognium-dev ${{ needs.build.outputs.version }}, ref \`${{ needs.build.outputs.ref }}\`, commit \`${{ needs.build.outputs.sha }}\`. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              "" \
              "This folder keeps \`run-summary.json\` and one scorecard per corpus, for cogniumhq/loops \`checks/measurements.py\`." \
              > "${SWEEP}/README.md"
          fi

          STAGE=$(mktemp -d)
          cp -a "$SWEEP" "$STAGE/sweep"
          # The coverage file was updated before this checkout. Preserve it
          # across the reset onto origin/main, or the day's new detections
          # would be thrown away with the runner's worktree.
          if [ -f baseline/coverage.json ]; then cp baseline/coverage.json "$STAGE/coverage.json"; fi
          if [ "$PUBLISH_RESULTS" = "true" ]; then
            if [ -d "results/${DAY}" ]; then cp -a "results/${DAY}" "$STAGE/dated"; fi
            if [ -d "raw/${DAY}" ]; then cp -a "raw/${DAY}" "$STAGE/raw"; fi
            cp results/README.md "$STAGE/README.md"
          fi

          git fetch origin main
          git checkout --force -B main origin/main
          if [ "$PUBLISH_RESULTS" = "true" ]; then
            rm -rf "results/${DAY}" "$SWEEP" "raw/${DAY}"
            cp -a "$STAGE/sweep" "$SWEEP"
            if [ -d "$STAGE/dated" ]; then cp -a "$STAGE/dated" "results/${DAY}"; fi
            if [ -d "$STAGE/raw" ]; then cp -a "$STAGE/raw" "raw/${DAY}"; fi
            cp "$STAGE/README.md" results/README.md
            git add "$SWEEP" results/README.md
            if [ -d "results/${DAY}" ]; then git add "results/${DAY}"; fi
            if [ -d "raw/${DAY}" ]; then git add "raw/${DAY}"; fi
            MSG="feat: publish the ${DAY} detection-quality sweep"
          else
            rm -rf "$SWEEP"
            cp -a "$STAGE/sweep" "$SWEEP"
            git add "$SWEEP"
            MSG="chore: record the ${DAY} nightly detection-quality sweep"
          fi
          if [ -f "$STAGE/coverage.json" ]; then
            cp "$STAGE/coverage.json" baseline/coverage.json
            git add baseline/coverage.json
          fi
          if ! git diff --cached --quiet -- baseline/coverage.json; then
            MSG="${MSG}"$'\n\n'"Extend the daily detection coverage with cases this run flagged."
          fi
          if git diff --cached --quiet; then
            echo "no changes to publish"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "$MSG"
          git push origin HEAD:main

      # Fail the run last, so the report, the artifact and the defect all land
      # first. A red nightly with no artifact is not diagnosable.
      - name: Fail on regression
        if: ${{ steps.compare.outputs.regressed == 'true' }}
        run: |
          echo "detection quality regressed against baseline/detection-quality.json"
          exit 1
