name: validate-results

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate results/*/results.json against schema, sums, artifacts, folders
        run: node scripts/validate-results.mjs
      - name: Publisher still reproduces the 2026-10-22 result set
        run: node scripts/publish-run.mjs --check --run results/2026-10-22-detection-quality/run-summary.json --expect results/2026-10-22/results.json --date 2026-10-22 --sha d95544f9334ef9a72d1a453cfb2dd66a0d862d04
