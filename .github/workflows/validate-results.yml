name: validate-results

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate results/*/results.json against schema, sums, artifacts, folders
        run: node scripts/validate-results.mjs
